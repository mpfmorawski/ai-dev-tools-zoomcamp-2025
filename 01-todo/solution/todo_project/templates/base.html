<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Todo Project{% endblock %}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem auto;
            max-width: 900px;
        }

        header {
            margin-bottom: 1rem;
        }

        nav a {
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>{% block header %}Todo Project{% endblock %}</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'todos:task_list' %}">Tasks</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p style="margin-top:2rem; font-size:0.9rem; color:#666;">&copy; Todo Project</p>
    </footer>
</body>

</html>
